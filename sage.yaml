name: "sage-bioclip2"
namespace: "beckman"
version: "2.0.0"
description: "BioCLIP2 species classifier, re-architected as a pywaggle2 cache consumer — reads self-describing -v2- frames a producer (media-sampler3, THE producer for images and audio) wrote to the shared on-node cache and runs BioCLIP-2.5 (TreeOfLife-200M) taxonomy classification frame-anchored (observation time = capture time). The cache dir is a single --input parameter, so the SAME plugin classifies either full media-sampler3 frames OR sage-yolo2 crops (the detect→classify cascade) with no code change. When classifying a crop, the crop's YOLO provenance is attached to the species record for full traceability."
authors: "Pete Beckman"
collaborators: "Sage Team"
funding: "NSF 2436842"
license: "BSD 3-clause"
keywords: "species classification, taxonomy, BioCLIP, TreeOfLife, computer vision, machine learning, edge computing, cache consumer, pywaggle2, biodiversity"
homepage: "https://sagecontinuum.org"
source:
    architectures:
        - "linux/arm64"    # Thor target (ECR can build it; dev path = native Thor build + k3s side-load)
    url: "https://github.com/flint-pete/sage-bioclip2.git"
    branch: "master"
inputs:
    - id: "source"
      type: "string"
      description: "Acquisition mode: cache (consume producer frames from the shared cache — production) or image-dir (local test folder)."
    - id: "input"
      type: "string"
      description: "THE SWITCH. cache dir <root>/<cache-name>/<camera> — point at the RAW stream (e.g. /local-cache/camera/top) to classify full frames, or a CROP stream (e.g. /local-cache/camera-crops/top-crop-0) to classify only sage-yolo2 crops. Or a directory of test images for image-dir."
    - id: "every"
      type: "string"
      description: "Wake cadence. 0 = single-shot (run once, exit). Accepts s/m/h."
    - id: "select-every"
      type: "string"
      description: "Sampling stride: one frame per this much CAPTURE-time. 0 = the newest unseen frame. Accepts s/m/h."
    - id: "max-frames"
      type: "int"
      description: "Cap frames classified per wake (0 = unlimited)."
    - id: "all-unseen"
      type: "string"
      description: "Flag (no value). Backlog mode — classify every not-yet-seen frame (capped by max-frames). Include '--all-unseen' to enable."
    - id: "max-runtime"
      type: "int"
      description: "Overall wall-clock bound in seconds (0 = forever). Lets a scheduled job self-exit to free the GPU."
    - id: "consumer-id"
      type: "string"
      description: "Override the seen-store <consumer-id> segment (default: WAGGLE_JOB_NAME+WAGGLE_TASK_NAME). Give two instances the SAME id to cooperatively divide one cache."
    - id: "seen-store"
      type: "string"
      description: "Override the full seen-store path (default: auto, under the cache's reserved .state area)."
    - id: "reprocess"
      type: "string"
      description: "Flag (no value). Ignore the seen-store (classify regardless of memory); still records what it processes. Include '--reprocess' to enable."
    - id: "rank"
      type: "string"
      description: "Taxonomic rank to predict: Kingdom, Phylum, Class, Order, Family, Genus, or Species. Default Species."
    - id: "model"
      type: "string"
      description: "BioCLIP model string (default: hf-hub:imageomics/bioclip-2.5-vith14)."
    - id: "top-k"
      type: "int"
      description: "Number of top predictions to report (default: 5)."
    - id: "min-confidence"
      type: "float"
      description: "Below this the top prediction is treated as no-confident-prediction (default: 0.1)."
    - id: "upload-image"
      type: "string"
      description: "Y = allow annotated-image uploads, N = never. Governed by save-match when set."
    - id: "save-match"
      type: "string"
      description: "OR-list of Taxon:confidence rules — matches the SCIENTIFIC or COMMON name of any prediction (e.g. 'Cardinalis cardinalis:0.5' or 'Northern Cardinal:0.5' as an example), or '*:0.5'. Uploads the annotated frame when the top prediction matches."
resources:
    - type: "RGB_image_producer"
      view: "street"
      min_resolution: "224x224"
metadata:
    ontology: env.species.*
testing:
    mask_entrypoint: true
    command: ["python3", "-m", "pytest", "-q", "tests/"]
